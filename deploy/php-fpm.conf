; see-php pool — copy to /etc/php/8.5/fpm/pool.d/see-php.conf and adjust paths.
; One small static pool: SUNAT latency (0.3–3 s) dominates, not PHP.

[see-php]
user = see-php
group = see-php

listen = /run/see-php/fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = static
pm.max_children = 4
pm.max_requests = 1000

; SOAP read timeout (SEE_SOAP_TIMEOUT) + margin; Nginx waits a bit longer.
request_terminate_timeout = 75s

; Only what the service reads. The token comes from a root-only drop-in or
; secret store, never from the repository.
clear_env = yes
env[SEE_API_TOKEN] = $SEE_API_TOKEN
env[SEE_TWIG_CACHE] = /var/cache/see-php/twig
env[SEE_SOAP_CONNECT_TIMEOUT] = 10
env[SEE_SOAP_TIMEOUT] = 45

php_admin_value[memory_limit] = 128M
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[soap.wsdl_cache_dir] = /var/cache/see-php/wsdl
php_admin_value[openssl.cafile] = /etc/ssl/certs/ca-certificates.crt
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
