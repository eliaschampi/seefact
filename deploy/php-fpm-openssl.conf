# systemd drop-in: copy to /etc/systemd/system/php8.5-fpm.service.d/see-php-openssl.conf,
# adjust the path, then `systemctl daemon-reload && systemctl restart php8.5-fpm`.
#
# It must reach the FPM master: OpenSSL is initialized when PHP loads its
# extensions, before the pool's env[] lines apply. `bin/see diagnose` shows
# whether the legacy provider is active.
[Service]
Environment=OPENSSL_CONF=/opt/see-php/current/deploy/openssl.cnf
