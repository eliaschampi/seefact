# see-php — internal only. Listens on a unix socket the core can reach;
# never bind it to a public interface.

server {
    listen unix:/run/see-php/http.sock;

    client_max_body_size 8m;
    access_log off;

    location /v1/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/see-php/current/public/index.php;
        fastcgi_pass unix:/run/see-php/fpm.sock;
        fastcgi_read_timeout 80s;
    }

    location / {
        return 404;
    }
}
